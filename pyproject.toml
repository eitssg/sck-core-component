[project]
name = "sck-core-component"
description = "Core-Automation Component Compiler"
version = "1.3.0"
license = "GPL-3.0-only"
readme = "README.md"
authors = [{ name = "James Barwick", email = "jbarwick@eits.com.sg" }]
maintainers = [{ "name" = "James Barwick", "email" = "jbarwick@eits.com.sg" }]
keywords = ["sck", "core", "aws", "cloud", "automation"]
requires-python = ">=3.11,<3.13"


dependencies = [
    "boto3 (>=1.34.51,<1.35.0)",
    "botocore (>=1.34.51,<1.35.0)",
    "jsonpath-ng (>=1.7.0,<1.8.0)",
    "netaddr (>=1.3.0,<1.4.0)",
    "filters (>=1.3.2,<1.4.0)",
    "deepdiff (>=7.0.1,<8.0.0)",
    "jinja2 (>=3.1.4,<4.0.0)",
    "jmespath (>=1.0.1,<2.0.0)",
    "sck-core-db",
    "sck-core-execute",
    "sck-core-framework",
    "sck-core-runner",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "flake8>=7.1.1",
    "cfn-lint>=1.22",
    "pytest-asyncio>=0.25.0",
    "boto3-stubs>=1.34.51",
    "pytest-dotenv>=0.5.2",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core_component"]

[tool.black]
line-length = 132
target-version = ["py311"]
skip-string-normalization = true

# Use a proper multi-line regex (mirrors style used in framework module)
exclude = '''
/(
        \.git
    | \.mypy_cache
    | \.pytest_cache
    | build
    | dist
    | venv
    | \.venv
    | htmlcov
)/
'''

[tool.uv.sources]
sck-core-framework = { path = "../sck-core-framework", editable = true }
sck-core-db = { path = "../sck-core-db", editable = true }
sck-core-execute = { path = "../sck-core-execute", editable = true }
sck-core-runner = { path = "../sck-core-runner", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
