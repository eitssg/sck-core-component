AWS::VPCEndpoint_external:
  _Type: Component

  Configuration:
      Properties:
        Pipeline::Security:
          _Type: Pipeline::IpSecurity
        PrivateDnsEnabled:
          _Type: boolean
          _Required: false
        SecurityGroupIds:
          _Type: list
          _Required: false
          _ListItemType: string
        ServiceName:
          _Type: string
          _Required: true
        Aliases:
          _Type: list
          _Required: false
          _ListItemType: string
        SubnetIds:
          _Type: string
          _Required: false
        VpcEndpointType:
          _Type: string
          _Required: false
        VpcId:
          _Type: string
          _Required: false
        AzCount:
          _Type: int
          _Required: false
        LoadBalancerAttributes:
          _Type: list
          _Required: false
          _ListItemType: Common::Attributes
        Listener:
          _KeyRegex: ".*Listener"
          _KeyCardinality: 0-10
          _Type: Resource::AWS::ElasticLoadBalancingV2::Listener::NLB
        TargetGroup:
          _Required:
            Spec::Property: [ NetworkLoadBalancer ]
          _KeyRegex: '.*TargetGroup'
          _KeyCardinality: 0-10
          _Type: Resource::AWS::ElasticLoadBalancingV2::TargetGroup::NLB
        External:
          Pipeline::Security:
            _Type: Pipeline::IpSecurity
        TargetPort:
          _Type: int
          _Required: false


AWS::VPCEndpointRecord:
  _Type: Component

  Configuration:
      Properties:
        HostedZoneId:
          _Type: string
          _Required: false
        RecordSets:
          _Type: list
          _Required: false
          _ListItemType: Common::Attributes
        Name:
          _Type: string
          _Required: false
        Type:
          _Type: string
          _Required: false
        ResourceRecords:
          _Type: list
          _Required: false
          _ListItemType: Common::Attributes
        AliasTarget:
          _Type: string
          _Required: false
  
AWS::ElasticLoadBalancingV2::LoadBalancer:
  _Type: Component

  Configuration:
      Properties:
        LoadBalancerAttributes:
          _Type: list
          _Required: false
          _ListItemType: Common::Attributes