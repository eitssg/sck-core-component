AWS::VPCEndpoint:
  _Type: Component

  Configuration:
      Properties:
        PrivateDnsEnabled:
          _Type: boolean
          _Required: false
        SecurityGroupIds:
          _Type: list
          _Required: false
          _ListItemType: string
        ServiceName:
          _Type: string
          _Required: true
        Aliases:
          _Type: list
          _Required: false
          _ListItemType: string
        SubnetIds:
          _Type: list
          _Required: false
          _ListItemType: string
        VpcEndpointType:
          _Type: string
          _Required: false
        VpcId:
          _Type: string
          _Required: false
        Pipeline::Security:
          _Required: false
          _Type: Pipeline::IpSecurity

AWS::VPCEndpointRecord:
  _Type: Component

  Configuration:
      Properties:
        HostedZoneId:
          _Type: string
          _Required: false
        RecordSets:
          _Type: list
          _Required: false
          _ListItemType: Common::Attributes
        Name:
          _Type: string
          _Required: false
        Type:
          _Type: string
          _Required: false
        ResourceRecords:
          _Type: list
          _Required: false
          _ListItemType: Common::Attributes
        AliasTarget:
          _Type: string
          _Required: false
        Pipeline::Security:
          _Required: false          
          _Type: Pipeline::IpSecurity
